apiVersion: v1
kind: Namespace
metadata: {name: kdiag-readiness}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: readiness-failure, namespace: kdiag-readiness}
spec:
  replicas: 2
  selector: {matchLabels: {app: readiness-failure}}
  template:
    metadata: {labels: {app: readiness-failure}}
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
            failureThreshold: 2

