apiVersion: v1
kind: Namespace
metadata:
  name: kdiag-targetport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: kdiag-targetport
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      containers:
        - name: payment
          image: busybox:1.36.1
          ports:
            - {name: http, containerPort: 8080}
          command: ["/bin/sh", "-c"]
          args: ["printf 'payment ok\\n' >/tmp/index.html; exec httpd -f -p 8080 -h /tmp"]
          readinessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: kdiag-targetport
spec:
  selector: {app: payment}
  ports:
    - {name: http, port: 80, targetPort: 9090}
