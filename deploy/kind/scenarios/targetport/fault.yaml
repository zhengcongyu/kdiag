apiVersion: v1
kind: Namespace
metadata:
  name: kdiag-targetport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: kdiag-targetport
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      containers:
        - name: payment
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          command: ["/bin/sh", "-c"]
          args: ["sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
          readinessProbe:
            httpGet: {path: /, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: kdiag-targetport
spec:
  selector: {app: payment}
  ports:
    - {name: http, port: 80, targetPort: 9090}

