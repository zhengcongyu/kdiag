server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://${KDIAG_API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header X-Request-ID $request_id;
  }

  # The HTML shell references content-hashed assets from the current release.
  # Never let a browser reuse an old shell after a rollout, otherwise it can
  # request JavaScript files that no longer exist and render a blank page.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }
}
