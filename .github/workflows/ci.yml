name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/...
      - run: go build ./cmd/...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kdiag-web lint
      - run: pnpm --filter kdiag-web typecheck
      - run: pnpm --filter kdiag-web test --run
      - run: pnpm --filter kdiag-web build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/kdiag
      - run: helm template test deploy/helm/kdiag >/dev/null
      - run: pip install yamllint==1.37.1
      - run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: disable, empty-lines: {max-end: 1}}}"
          .github deploy/kind docker-compose.yml
          deploy/helm/kdiag/Chart.yaml deploy/helm/kdiag/values.yaml
