name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go test ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kdiag-web test --run
      - run: pnpm --filter kdiag-web build
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/kdiag

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: Build CLI and API
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/kdiag-linux-${GOARCH}" ./cmd/kdiag
          go build -trimpath -ldflags="-s -w" -o "dist/kdiag-api-linux-${GOARCH}" ./cmd/kdiag-api
          sha256sum dist/* > "dist/checksums-${GOARCH}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*

  images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kdiag-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kdiag-web:${{ github.ref_name }}

  release:
    needs: [artifacts, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: azure/setup-helm@v4
      - run: helm package deploy/helm/kdiag --destination dist
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: KDiag ${{ github.ref_name }} - Explainable Kubernetes Diagnostics MVP
          body_path: docs/release-notes/v0.1.0.md
          files: dist/*
