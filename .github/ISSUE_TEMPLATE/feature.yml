name: Feature request
description: Propose a diagnostic or platform capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What diagnostic question cannot be answered today?}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence model, description: What supporting, contradicting, and missing evidence should be produced?}
  - type: textarea
    id: security
    attributes: {label: Security and permissions, description: Does this require additional RBAC or active probing?}

